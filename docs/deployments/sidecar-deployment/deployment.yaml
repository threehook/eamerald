apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-deployment
  labels:
    app.kubernetes.io/name: ToDo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo
  template:
    metadata:
      labels:
        app: todo
    spec:
      # using an init container to download the eamerald edge directory db file that contains our required user informations
      initContainers:
      - name: get-citadel
        image: busybox:1.36
        command: ["/bin/sh","-c","cd /db/;wget --no-check-certificate https://www.topaz.sh/assets/templates/v34/citadel/db/citadel.db;"]
        volumeMounts:
        - name: eamerald-db
          mountPath: "/db/"
      containers:
      - name: eamerald
        image: ghcr.io/threehook/eamerald:latest
        command: ["/app/eameraldd"]
        args: ["run","-c","/config/config.yaml"]
        # only exposing the ports used by the todo backend app
        ports:
        - containerPort: 8282
        - containerPort: 9292
        - containerPort: 8080
        volumeMounts:
          - name: eamerald-config
            mountPath: "/config/config.yaml"
            subPath: "config.yaml"
          - name: shared-certs
            mountPath: "/root/.config/"
          - name: eamerald-db
            mountPath: "/db/"
      - name: todo 
        image: todo-go-v2:latest
        # as we upload a local built docker image to minikube we want to ensure it will not try to pull from an upstream registry
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
        volumeMounts:
          - name: config
            mountPath: "/app/.env"
            subPath: ".env"
          - name: shared-certs
            mountPath: "/root/.config/"
      volumes:
      - name: config
        configMap:
          name: "todo"
          items:
          - key: ".env"
            path: ".env"
      - name: eamerald-config
        configMap:
          name: "eamerald-config"
      # shared volume between eamerald and backend application to access the certs
      # recommended to use a cert-manager to generate and share the certificates between required parties
      - name: shared-certs
        emptyDir: {}
      # shared volume between eamerald and init container to grab the prepared edge directory db file
      - name: eamerald-db
        emptyDir: {}
