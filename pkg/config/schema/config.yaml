# yaml-language-server: $schema=./config.json
---
# config schema version
version: 2

# logger settings.
logging:
  prod: true
  log_level: info
  grpc_log_level: info

# debug service settings
debug_service:
  enabled: false
  listen_address: ""
  shutdown_timeout: 0

# edge directory configuration.
directory:
  db_path: '${EAMERALD_DB_DIR}/test.db'
  request_timeout: 5s # set as default, 5 secs.
  backend: '${EAMERALD_DIRECTORY_BACKEND}' # boltdb (default, when unset) | postgres
  postgres:
    dsn: '${EAMERALD_DIRECTORY_POSTGRES_DSN}' # used when backend is postgres

# remote directory is used to resolve the identity for the authorizer.
remote_directory:
  address: "0.0.0.0:9292" # set as default, it should be the same as the reader as we resolve the identity from the local directory service.
  insecure: true
  no_tls: false
  no_proxy: false
  api_key: ""
  token: ""
  client_cert_path: ""
  client_key_path: ""
  ca_cert_path: ""
  headers:
    aserto-account-id: "00000000-1111-2222-3333-444455556666"

# default jwt validation configuration
jwt:
  acceptable_time_skew_seconds: 5 # set as default, 5 secs
  allowed_issuers: # NOTE: if empty, any issuer is accepted !!!
  #  - "https://issuer.example.com/"
  cache_refresh_min_interval: 5m  # set as default, 5 minutes
  cache_refresh_max_interval: 15m # set as default, 15 minutes
  expected_audience: "" # set as default, empty

# authentication configuration
auth:
  keys:
    - "69ba614c64ed4be69485de73d062a00b"
    - "##Ve@rySecret123!!"
  options:
    default:
      enable_api_key: true
      enable_anonymous: false
    overrides:
      paths:
        - /aserto.authorizer.v2.Authorizer/Info
        - /grpc.reflection.v1.ServerReflection/ServerReflectionInfo
        - /grpc.reflection.v1alpha.ServerReflection/ServerReflectionInfo
      override:
        enable_anonymous: true
        enable_api_key: false

api:
  health:
    listen_address: "0.0.0.0:9494"
    certs:
      tls_key_path: '${EAMERALD_CERTS_DIR}/gateway.key'
      tls_cert_path: '${EAMERALD_CERTS_DIR}/gateway.crt'
      tls_ca_cert_path: '${EAMERALD_CERTS_DIR}/gateway-ca.crt'

  metrics:
    listen_address: "0.0.0.0:9696"
    certs:
      tls_key_path: '${EAMERALD_CERTS_DIR}/gateway.key'
      tls_cert_path: '${EAMERALD_CERTS_DIR}/gateway.crt'
      tls_ca_cert_path: '${EAMERALD_CERTS_DIR}/gateway-ca.crt'

  services:
    console:
      grpc:
        listen_address: "0.0.0.0:8081"
        fqdn: ""
        certs:
          tls_key_path: '${EAMERALD_CERTS_DIR}/grpc.key'
          tls_cert_path: '${EAMERALD_CERTS_DIR}/grpc.crt'
          tls_ca_cert_path: '${EAMERALD_CERTS_DIR}/grpc-ca.crt'
      gateway:
        listen_address: "0.0.0.0:8080"
        fqdn: ""
        certs:
          tls_key_path: '${EAMERALD_CERTS_DIR}/gateway.key'
          tls_cert_path: '${EAMERALD_CERTS_DIR}/gateway.crt'
          tls_ca_cert_path: '${EAMERALD_CERTS_DIR}/gateway-ca.crt'
        allowed_origins:
        - http://localhost
        - http://localhost:*
        - https://localhost
        - https://localhost:*
        - https://0.0.0.0:*
        allowed_headers:
        - "Authorization"
        - "Content-Type"
        - "If-Match"
        - "If-None-Match"
        - "Depth"
        allowed_methods:
        - "GET"
        - "POST"
        - "HEAD"
        - "DELETE"
        - "PUT"
        - "PATCH"
        - "PROFIND"
        - "MKCOL"
        - "COPY"
        - "MOVE"
        http: false
        read_timeout: 2s
        read_header_timeout: 2s
        write_timeout: 2s
        idle_timeout: 30s

    reader:
      grpc:
        listen_address: "0.0.0.0:9292"
        # if certs are not specified default certs will be generate with the format reader_grpc.*
        certs:
          tls_key_path: '${EAMERALD_CERTS_DIR}/grpc.key'
          tls_cert_path: '${EAMERALD_CERTS_DIR}/grpc.crt'
          tls_ca_cert_path: '${EAMERALD_CERTS_DIR}/grpc-ca.crt'
      gateway:
        listen_address: "0.0.0.0:9393"
        fqdn: ""
        # if not specified, the allowed_origins includes localhost by default
        allowed_origins:
        - http://localhost
        - http://localhost:*
        - https://localhost
        - https://localhost:*
        - https://0.0.0.0:*
        # if no certs are specified, the gateway will have the http flag enabled (http: true)
        certs:
          tls_key_path: '${EAMERALD_CERTS_DIR}/gateway.key'
          tls_cert_path: '${EAMERALD_CERTS_DIR}/gateway.crt'
          tls_ca_cert_path: '${EAMERALD_CERTS_DIR}/gateway-ca.crt'
        http: false
        read_timeout: 2s # default 2 seconds
        read_header_timeout: 2s
        write_timeout: 2s
        idle_timeout: 30s # default 30 seconds
    writer:
      grpc:
        listen_address: "0.0.0.0:9292"
        certs:
          tls_key_path: '${EAMERALD_CERTS_DIR}/grpc.key'
          tls_cert_path: '${EAMERALD_CERTS_DIR}/grpc.crt'
          tls_ca_cert_path: '${EAMERALD_CERTS_DIR}/grpc-ca.crt'
      gateway:
        listen_address: "0.0.0.0:9393"
        fqdn: ""
        allowed_origins:
        - http://localhost
        - http://localhost:*
        - https://localhost
        - https://localhost:*
        certs:
          tls_key_path: '${EAMERALD_CERTS_DIR}/gateway.key'
          tls_cert_path: '${EAMERALD_CERTS_DIR}/gateway.crt'
          tls_ca_cert_path: '${EAMERALD_CERTS_DIR}/gateway-ca.crt'
        http: false
        read_timeout: 2s
        read_header_timeout: 2s
        write_timeout: 2s
        idle_timeout: 30s
    model:
      grpc:
        listen_address: "0.0.0.0:9292"
        certs:
          tls_key_path: '${EAMERALD_CERTS_DIR}/grpc.key'
          tls_cert_path: '${EAMERALD_CERTS_DIR}/grpc.crt'
          tls_ca_cert_path: '${EAMERALD_CERTS_DIR}/grpc-ca.crt'
      gateway:
        listen_address: "0.0.0.0:9393"
        fqdn: ""
        allowed_origins:
        - http://localhost
        - http://localhost:*
        - https://localhost
        - https://localhost:*
        certs:
          tls_key_path: '${EAMERALD_CERTS_DIR}/gateway.key'
          tls_cert_path: '${EAMERALD_CERTS_DIR}/gateway.crt'
          tls_ca_cert_path: '${EAMERALD_CERTS_DIR}/gateway-ca.crt'
        http: false
        read_timeout: 2s
        read_header_timeout: 2s
        write_timeout: 2s
        idle_timeout: 30s
    exporter:
      grpc:
        listen_address: "0.0.0.0:9292"
        certs:
          tls_key_path: '${EAMERALD_CERTS_DIR}/grpc.key'
          tls_cert_path: '${EAMERALD_CERTS_DIR}/grpc.crt'
          tls_ca_cert_path: '${EAMERALD_CERTS_DIR}/grpc-ca.crt'
      gateway:
        listen_address: "0.0.0.0:9393"
        fqdn: ""
        allowed_origins:
        - http://localhost
        - http://localhost:*
        - https://localhost
        - https://localhost:*
        certs:
          tls_key_path: '${EAMERALD_CERTS_DIR}/gateway.key'
          tls_cert_path: '${EAMERALD_CERTS_DIR}/gateway.crt'
          tls_ca_cert_path: '${EAMERALD_CERTS_DIR}/gateway-ca.crt'
        http: false
        read_timeout: 2s
        read_header_timeout: 2s
        write_timeout: 2s
        idle_timeout: 30s
    importer:
      grpc:
        listen_address: "0.0.0.0:9292"
        certs:
          tls_key_path: '${EAMERALD_CERTS_DIR}/grpc.key'
          tls_cert_path: '${EAMERALD_CERTS_DIR}/grpc.crt'
          tls_ca_cert_path: '${EAMERALD_CERTS_DIR}/grpc-ca.crt'
      gateway:
        listen_address: "0.0.0.0:9393"
        fqdn: ""
        allowed_origins:
        - http://localhost
        - http://localhost:*
        - https://localhost
        - https://localhost:*
        certs:
          tls_key_path: '${EAMERALD_CERTS_DIR}/gateway.key'
          tls_cert_path: '${EAMERALD_CERTS_DIR}/gateway.crt'
          tls_ca_cert_path: '${EAMERALD_CERTS_DIR}/gateway-ca.crt'
        http: false
        read_timeout: 2s
        read_header_timeout: 2s
        write_timeout: 2s
        idle_timeout: 30s

    authorizer:
      needs:
        - reader
      grpc:
        connection_timeout_seconds: 2
        listen_address: "0.0.0.0:8282"
        certs:
          tls_key_path: '${EAMERALD_CERTS_DIR}/grpc.key'
          tls_cert_path: '${EAMERALD_CERTS_DIR}/grpc.crt'
          tls_ca_cert_path: '${EAMERALD_CERTS_DIR}/grpc-ca.crt'
      gateway:
        listen_address: "0.0.0.0:8383"
        fqdn: ""
        certs:
          tls_key_path: '${EAMERALD_CERTS_DIR}/gateway.key'
          tls_cert_path: '${EAMERALD_CERTS_DIR}/gateway.crt'
          tls_ca_cert_path: '${EAMERALD_CERTS_DIR}/gateway-ca.crt'
        allowed_origins:
        - http://localhost
        - http://localhost:*
        - https://localhost
        - https://localhost:*
        - https://0.0.0.0:*
        allowed_headers:
        - "Authorization"
        - "Content-Type"
        - "If-Match"
        - "If-None-Match"
        - "Depth"
        allowed_methods:
        - "GET"
        - "POST"
        - "HEAD"
        - "DELETE"
        - "PUT"
        - "PATCH"
        - "PROFIND"
        - "MKCOL"
        - "COPY"
        - "MOVE"
        http: false
        read_timeout: 2s
        read_header_timeout: 2s
        write_timeout: 2s
        idle_timeout: 30s

opa:
  instance_id: "-"
  # package root the AuthZEN Access API falls back to when a request selects
  # no policy of its own. Only needed when the bundle carries more than one
  # package root.
  policy_root: ""
  graceful_shutdown_period_seconds: 2
  # max_plugin_wait_time_seconds: 30 set as default
  local_bundles:
    paths: []
    skip_verification: true
  config:
    services:
      ghcr:
        url: https://ghcr.io
        type: oci
        credentials:
          bearer:
            scheme: "Bearer"
            token: "${GIT_TOKEN}"
        response_header_timeout_seconds: 15
    bundles:
      test:
        service: ghcr
        resource: "ghcr.io/aserto-policies/policy-rebac:latest"
        persist: false
        config:
          polling:
            min_delay_seconds: 60
            max_delay_seconds: 120
    plugins:
      # logius adl level 1 decision logger plugin configuration
      adl_decision_logger:
        enabled: true
        output: 'stdout,otlp'        # comma-separated: stdout, otlp, or both. Defaults to both when unset. Settable via ${LOG_OUTPUT}.
        otlp:
          endpoint: 'localhost:4317'  # otlp/gRPC collector address, e.g. a Grafana Alloy receiver
          insecure: true               # disable TLS - typical for a same-cluster/sidecar collector
        resource: {}                   # producer identity, e.g. {service.name: eamerald}. REQUIRED when records are aggregated across organisations.
        resource_context:              # keys read from an authorizer resource context to fill the AuthZEN resource
          type_key: 'object_type'
          id_key: 'object_id'

      # aserto edge directory sync plugin configuration
      aserto_edge:
        enabled: false
        addr: ""                    # gRPC directory service address.
        apikey: ""                  # directory API key.
        timeout: 5                  # gRPC connection timeout in seconds.
        sync_interval: 1            # sync run interval in minutes.
        insecure: true              # when using TLS connections, skip verification of the server certificate.
        page_size: 0                # deprecated: no longer used.
        client_cert_path: ""        # when using mTLS connections, ClientCertPath is the path of the client's certificate file.
        client_key_path: ""         # when using mTLS connections, ClientKeyPath is the path of the client's private key file.
        no_tls: false               # disable TLS and use a plaintext connection.
        no_proxy: false             # bypasses any configured HTTP proxy.
        headers:                    # additional headers to include in requests to the service.
