version: 2

project_name: eamerald

env:
  # https://goreleaser.com/customization/env/
  - REGISTRY=ghcr.io
  - ORG=threehook
  - REPO=eamerald
  - IMAGE_ORG=threehook
  - IMAGE_REPO=eamerald
  - DESCRIPTION="Eamerald Authorization Service"
  - LICENSE=Apache-2.0

before:
  # https://goreleaser.com/customization/hooks/
  hooks:

builds:
  # https://goreleaser.com/customization/build/
  - id: mrldd
    main: ./daemon
    binary: mrldd
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
      - -w
      - -X github.com/{{ .Env.ORG }}/{{ .Env.REPO }}/daemon/version.ver={{.Version}}
      - -X github.com/{{ .Env.ORG }}/{{ .Env.REPO }}/daemon/version.commit={{.ShortCommit}}
      - -X github.com/{{ .Env.ORG }}/{{ .Env.REPO }}/daemon/version.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: mrld
    main: ./mrld
    binary: mrld
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
      - -w
      - -X github.com/{{ .Env.ORG }}/{{ .Env.REPO }}/mrld/version.ver={{.Version}}
      - -X github.com/{{ .Env.ORG }}/{{ .Env.REPO }}/mrld/version.commit={{.ShortCommit}}
      - -X github.com/{{ .Env.ORG }}/{{ .Env.REPO }}/mrld/version.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: mrld-db
    main: ./db
    binary: mrld-db
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
      - -w
      - -X github.com/{{ .Env.ORG }}/{{ .Env.REPO }}/pkg/version.ver={{.Version}}
      - -X github.com/{{ .Env.ORG }}/{{ .Env.REPO }}/pkg/version.commit={{.ShortCommit}}
      - -X github.com/{{ .Env.ORG }}/{{ .Env.REPO }}/pkg/version.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

  - id: mrld-backup
    main: ./backup
    binary: mrld-backup
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
      - -w
      - -X github.com/{{ .Env.ORG }}/{{ .Env.REPO }}/pkg/version.ver={{.Version}}
      - -X github.com/{{ .Env.ORG }}/{{ .Env.REPO }}/pkg/version.commit={{.ShortCommit}}
      - -X github.com/{{ .Env.ORG }}/{{ .Env.REPO }}/pkg/version.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  # No archives are downloaded/installed standalone anymore - everything
  # ships as the docker image. Without this, goreleaser falls back to its
  # own default .tar.gz archive instead of skipping archiving entirely.
  # https://goreleaser.com/customization/archive/
  - formats:
      - binary

checksum:
  # https://goreleaser.com/customization/checksum/
  name_template: "checksums.txt"

snapshot:
  # https://goreleaser.com/customization/snapshots/
  version_template: "{{ incpatch .Version }}-{{ .ShortCommit }}{{ if .IsGitDirty }}-dirty{{ end }}"

source:
  # https://goreleaser.com/customization/source/
  enabled: false

changelog:
  # https://goreleaser.com/customization/changelog/
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  # https://goreleaser.com/customization/release/
  github:
    owner: "{{ .Env.IMAGE_ORG }}"
    name: "{{ .Env.IMAGE_REPO }}"

  # Branch pushes (main image publish) set DISABLE_GITHUB_RELEASE=true so we
  # still push to GHCR without opening a GitHub Release for every commit.
  # Tag pushes leave it unset and create a normal release.
  disable: "{{ eq .Env.DISABLE_GITHUB_RELEASE \"true\" }}"

  draft: false
  prerelease: "false"
  name_template: "{{.ProjectName}} {{.Tag}}"

blobs:
  # https://goreleaser.com/customization/blob/

dockers_v2:
  # https://goreleaser.com/customization/dockers_v2
  - dockerfile: "Dockerfile"

    platforms:
      - linux/amd64
      - linux/arm64

    ids:
      - mrldd
      - mrld-db
      - mrld-backup

    images:
      - "{{ .Env.REGISTRY }}/{{ .Env.IMAGE_ORG }}/{{ .Env.IMAGE_REPO }}"

    # Per-architecture staging tags only - not meant to be pulled directly.
    # docker_manifests below combines these into the real, multi-arch tags
    # (the version tag, main, latest).
    tags:
      - "{{ .Version }}"
      - "{{ if eq .Env.DISABLE_GITHUB_RELEASE \"true\" }}main{{ end }}"

    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.name": "{{.ProjectName}}"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
      "org.opencontainers.image.source": "https://github.com/{{ .Env.IMAGE_ORG }}/{{ .Env.IMAGE_REPO }}"
      "org.opencontainers.image.description": "{{ .Env.DESCRIPTION }}"
      "org.opencontainers.image.licenses": "{{ .Env.LICENSE }}"

    sbom: false # Attestation is not supported for the docker driver.

    extra_files:
    annotations:
    build_args:
    flags:

docker_manifests:
  # Combines the two per-arch "<tag>-amd64"/"<tag>-arm64" images above into
  # the real, user-facing multi-arch tags, so
  # `docker pull ghcr.io/threehook/eamerald:main` (or :<version>, :latest)
  # picks the right architecture on its own.
  # https://goreleaser.com/customization/docker_manifest/
  - name_template: "{{ .Env.REGISTRY }}/{{ .Env.IMAGE_ORG }}/{{ .Env.IMAGE_REPO }}:{{ .Version }}"
    image_templates:
      - "{{ .Env.REGISTRY }}/{{ .Env.IMAGE_ORG }}/{{ .Env.IMAGE_REPO }}:{{ .Version }}-amd64"
      - "{{ .Env.REGISTRY }}/{{ .Env.IMAGE_ORG }}/{{ .Env.IMAGE_REPO }}:{{ .Version }}-arm64"

  - name_template: "{{ if eq .Env.DISABLE_GITHUB_RELEASE \"true\" }}{{ .Env.REGISTRY }}/{{ .Env.IMAGE_ORG }}/{{ .Env.IMAGE_REPO }}:main{{ end }}"
    image_templates:
      - "{{ .Env.REGISTRY }}/{{ .Env.IMAGE_ORG }}/{{ .Env.IMAGE_REPO }}:main-amd64"
      - "{{ .Env.REGISTRY }}/{{ .Env.IMAGE_ORG }}/{{ .Env.IMAGE_REPO }}:main-arm64"

  - name_template: "{{ if and (not .IsSnapshot) (ne .Env.DISABLE_GITHUB_RELEASE \"true\") }}{{ .Env.REGISTRY }}/{{ .Env.IMAGE_ORG }}/{{ .Env.IMAGE_REPO }}:latest{{ end }}"
    image_templates:
      - "{{ .Env.REGISTRY }}/{{ .Env.IMAGE_ORG }}/{{ .Env.IMAGE_REPO }}:{{ .Version }}-amd64"
      - "{{ .Env.REGISTRY }}/{{ .Env.IMAGE_ORG }}/{{ .Env.IMAGE_REPO }}:{{ .Version }}-arm64"

retry:
  # https://goreleaser.com/customization/general/retry/
  attempts: 10
  delay: 10s
  max_delay: 5m

sboms:
  # https://goreleaser.com/customization/sbom/
  - id: default
    documents:
      - "${artifact}-{{.Os}}-{{.Arch}}.spdx.sbom.json"
    cmd: syft
    args:
      - "$artifact"
      - "--output"
      - "spdx-json=$document"
    env:
      - SYFT_FILE_METADATA_CATALOGER_ENABLED=true
    artifacts: binary
    ids:
      - mrld
      - mrldd
      - mrld-backup
      - mrld-db
