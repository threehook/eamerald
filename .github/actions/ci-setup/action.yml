name: CI setup
description: Go toolchain and Docker QEMU/Buildx/GHCR login shared by the ci workflow's jobs. The
  calling job must check the repo out itself before this step - a local action can't be the thing
  that checks itself out.

inputs:
  github-token:
    description: token used to authenticate to ghcr.io
    required: true

runs:
  using: composite
  steps:
    -
      name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: true
    -
      name: Setup QEMU
      uses: docker/setup-qemu-action@v4
    -
      name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4
    -
      name: Login to GitHub Packages Docker Registry
      uses: docker/login-action@v4
      with:
        registry: https://ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
