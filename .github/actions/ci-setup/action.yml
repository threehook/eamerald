name: CI setup
description: Checkout, Go toolchain, and Docker QEMU/Buildx/GHCR login shared by the ci workflow's jobs

inputs:
  fetch-depth:
    description: git fetch depth passed to actions/checkout
    required: false
    default: "1"
  github-token:
    description: token used to authenticate to ghcr.io
    required: true

runs:
  using: composite
  steps:
    -
      uses: actions/checkout@v7
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
    -
      name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'
        cache: true
    -
      name: Setup QEMU
      uses: docker/setup-qemu-action@v4
    -
      name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v4
    -
      name: Login to GitHub Packages Docker Registry
      uses: docker/login-action@v4
      with:
        registry: https://ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
