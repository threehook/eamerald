---
name: ci

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  push:
    # Push a snapshot-tagged image to GHCR on every push to main (not tagged `latest`).
    branches:
      - main
    # Publish `v1.2.3` tags as releases.
    tags:
      - v*
  # Run tests for all PRs
  pull_request:

permissions:
  actions: write
  attestations: write
  contents: write
  deployments: write
  packages: write

env:
  GO_RELEASER_VER: "v2.18.0"
  GO_LANGCI_LINT_VER: "v2.13.2"
  SYFT_VER: "v1.13.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Test Setup
        run: |
          make install-gotestsum
      -
        name: Build
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CLI_EXPERIMENTAL: "enabled"
        with:
          distribution: goreleaser
          version: ${{ env.GO_RELEASER_VER }}
          args: build --clean --snapshot --single-target
      -
        name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GO_LANGCI_LINT_VER }}
          args: --timeout=30m
      -
        name: Test Snapshot
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CLI_EXPERIMENTAL: "enabled"
        with:
          distribution: goreleaser
          version: ${{ env.GO_RELEASER_VER }}
          args: release --config .goreleaser-test.yml --clean --snapshot --skip archive,sbom
      -
        name: Unit Tests
        run: |
          .ext/bin/gotestsum --format short-verbose -- $(go list ./... | grep -v topazd/tests) \
            -count=1 -timeout 120s -parallel=1 -v -coverprofile=cover.out -coverpkg=./...
      -
        name: Integration Tests
        run: |
          .ext/bin/gotestsum --format short-verbose -- $(go list -tags=integration ./... | grep -v topazd/tests) \
            -tags=integration -count=1 -timeout 120s -parallel=1 -v -coverprofile=cover-integration.out -coverpkg=./...
      -
        name: Tests topazd
        run: |
          .ext/bin/gotestsum --format short-verbose -- $(go list ./topazd/tests/... | grep -v tests/template) \
            -count=1 -timeout 120s -parallel=1 -v -coverprofile=cover.out -coverpkg=./...
      -
        name: Templates Test (no-tls)
        run: |
          .ext/bin/gotestsum --format short-verbose -- github.com/threehook/eamerald/topazd/tests/template-no-tls/... \
            -count=1 -timeout 240s -parallel=1 -v -coverprofile=cover.out -coverpkg=./...
      -
        name: Templates Test (with-tls)
        run: |
          .ext/bin/gotestsum --format short-verbose -- github.com/threehook/eamerald/topazd/tests/template-with-tls/... \
            -count=1 -timeout 120s -parallel=1 -v -coverprofile=cover.out -coverpkg=./...
      -
        name: Upload code coverage
        uses: shogo82148/actions-goveralls@v1
        continue-on-error: true
        with:
          path-to-profile: cover.out

  push:
    needs: [test]
    runs-on: ubuntu-latest
    # release job owns tag pushes exclusively; this job only runs for main branch pushes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      -
        name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          fetch-depth: "0"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Setup syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: ${{ env.SYFT_VER }}
      -
        name: Push image to GitHub Container Registry
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GO_RELEASER_VER }}
          args: release --clean --snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CLI_EXPERIMENTAL: "enabled"

  release:
    needs: [test]
    runs-on: ubuntu-latest
    # Only release when ref is a tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      -
        name: CI setup
        uses: ./.github/actions/ci-setup
        with:
          fetch-depth: "0"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Setup syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: ${{ env.SYFT_VER }}
      -
        name: Release
        uses: goreleaser/goreleaser-action@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_CLI_EXPERIMENTAL: "enabled"
        with:
          distribution: goreleaser
          version: ${{ env.GO_RELEASER_VER }}
          args: release --clean
      - 
        name: Archive deployment examples
        run: |
          cd docs/deployments/sidecar-deployment && zip topaz_deployment_examples.zip *.yaml
      -
        name: Upload deployment examples
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: docs/deployments/sidecar-deployment
          asset_name: topaz_deployment_examples.zip
          tag: ${{ github.ref }}
          overwrite: false
