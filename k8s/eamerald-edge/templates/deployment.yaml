apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "eamerald.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # The local cache is per-pod and disposable (rebuilt from the hub on every restart), so - unlike eamerald-hub -
  # there's no shared file lock to protect and rolling updates are always safe.
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "eamerald.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "eamerald.labels" . | nindent 8 }}
    spec:
      containers:
        - name: eameraldd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./mrldd"]
          args: ["run", "-c", "/config/config.yaml"]
          env:
            {{- include "eamerald.commonEnv" . | nindent 12 }}
          ports:
            {{- include "eamerald.corePorts" . | nindent 12 }}
            {{- include "eamerald.authorizerPorts" . | nindent 12 }}
          readinessProbe:
            {{- include "eamerald.readinessProbe" (merge (dict "isEdge" true "hasAuthorizer" true) .) | nindent 12 }}
          livenessProbe:
            {{- include "eamerald.livenessProbe" . | nindent 12 }}
          volumeMounts:
            {{- include "eamerald.volumeMounts" . | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        - name: decisions
          emptyDir: {}
        # No PVC for either: the cache is disposable by design, and TLS certs aren't worth persisting for a Pod
        # that's expected to be recycled and resynced freely.
        - name: certs
          emptyDir: {}
        - name: db
          emptyDir: {}
