# Default values for the eamerald chart.

image:
  # For local iteration on Docker Desktop's Kubernetes, prefer `make k8s-deploy`
  # over building this "dev" tag by hand: Docker Desktop's Kubernetes caches
  # images by tag *separately* from the Docker CLI's daemon-visible store, so
  # with pullPolicy: IfNotPresent (needed here since this image is never
  # pushed to a registry), rebuilding under this same static tag can silently
  # never reach the running Pod - it just keeps the old image indefinitely,
  # with no error. `make k8s-deploy` avoids this by building under a fresh,
  # unique tag every run and passing it to Helm explicitly. This "dev" tag/
  # `make k8s-build` still exist for quick manual builds, just don't expect a
  # `kubectl delete pod` alone to pick up a rebuild under this same tag.
  #
  # To use a published image instead (e.g. ghcr.io/threehook/eamerald once
  # you publish one), override repository/tag. If that tag is ever reused/
  # overwritten in the registry (e.g. `:latest`), set pullPolicy: Always, or
  # you'll hit the exact same staleness problem against a real registry.
  # Preferring a unique, never-reused tag per image (a git SHA, a semver) for
  # published images too sidesteps this more robustly than relying on
  # pullPolicy: Always, and remains compatible with IfNotPresent's more
  # efficient (no registry round trip) local-cache behavior.
  repository: eamerald
  tag: dev
  pullPolicy: IfNotPresent

# eameraldd's directory service uses an embedded, single-writer BoltDB file, so
# this chart is not meant to be scaled beyond one replica.
replicaCount: 1

service:
  # Docker Desktop's Kubernetes maps LoadBalancer services to localhost
  # automatically, so this "just works" without port-forwarding. Set to
  # ClusterIP on clusters without that (use `kubectl port-forward` instead).
  type: LoadBalancer
  ports:
    health: 9494
    metrics: 9696
    directoryGRPC: 9292
    directoryGateway: 9393
    consoleGRPC: 8081
    consoleGateway: 8080
    authorizerGRPC: 8282
    authorizerGateway: 8383

# Persistent storage for the directory database and generated TLS certs, so
# they survive Pod restarts. Uses the cluster's default StorageClass (Docker
# Desktop provides "hostpath" out of the box) unless storageClassName is set.
persistence:
  enabled: true
  storageClassName: ""
  db:
    size: 1Gi
  certs:
    size: 64Mi

logging:
  level: info

# The directory manifest defines the authorization model: object types,
# relations, and permissions. Edit k8s/eamerald/files/manifest.yaml to change it;
# that file is this deployment's source of truth, applied to the database by
# an init container on every Pod start.
#
# Disable only if you manage the manifest out-of-band (e.g. by hand via
# `eamerald directory set manifest`), accepting that the model then lives solely
# as state in the database PVC and is not reproducible from this chart.
directory:
  manifest:
    enabled: true

# microsoft entra id (azure ad) directory sync plugin. The client secret is
# never set here: create it yourself as a Kubernetes Secret first, e.g.
#   kubectl create secret generic entra-credentials \
#     --from-literal=client_secret=<your-client-secret>
# then set existingSecretName below to that Secret's name.
entra:
  enabled: false
  tenantId: ""
  clientId: ""
  existingSecretName: ""
  pollIntervalSeconds: 300
  userObjectType: "user"
  groupObjectType: "group"
  memberRelation: "member"

# logius adl level 1 decision logger plugin: writes one JSON line per
# authorization decision to stdout, for scraping by a log-shipping agent
# (e.g. Grafana Alloy) into Loki.
adlDecisionLogger:
  enabled: true

# git policy source plugin: tracks a policy bundle directly from a git repo.
# This is the only policy source this chart configures; there is no OCI/ghcr
# bundle fallback. Only public-repo (unauthenticated HTTPS) fields are
# exposed here; extend with an auth block if a private repo is needed later.
git:
  enabled: true
  repo: "https://github.com/threehook/opa-policies"
  ref: "refs/heads/main"
  path: ""
  pollIntervalSeconds: 60

resources: {}
