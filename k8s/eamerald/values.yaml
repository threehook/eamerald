# Default values for the eamerald chart.

# What this install actually runs:
#   standalone - directory + authorizer + console in one instance (today's behavior). Fine for local dev or a deployment with no HA requirement.
#   hub        - directory only (no authorizer): the central source of truth. Pairs with one or more role: edge installs syncing from it.
#                Set directory.backend: postgres to allow replicaCount > 1.
#   edge       - authorizer + a local, disposable directory cache, kept in sync from a hub via the aserto_edge plugin
#                (edge.hub.* below). No writes accepted locally, no PVC: the cache is fully rebuilt by a sync on every restart.
role: standalone

image:
  # For local iteration on Docker Desktop's Kubernetes, prefer `make k8s-deploy` over building this "dev" tag by hand: Docker Desktop's
  # Kubernetes caches images by tag *separately* from the Docker CLI's daemon-visible store, so with pullPolicy: IfNotPresent (needed here
  # since this image is never pushed to a registry), rebuilding under this same static tag can silently never reach the running Pod - it just
  # keeps the old image indefinitely, with no error.
  # `make k8s-deploy` avoids this by building under a fresh, unique tag every run and passing it to Helm explicitly.
  # The "dev" tag and `make k8s-build` still exist for quick manual builds; just don't expect a `kubectl delete pod` alone to pick up a rebuild
  # under this same tag.
  #
  # To use a published image instead (e.g. ghcr.io/threehook/eamerald once you publish one), override repository/tag.
  # If that tag is ever reused/overwritten in the registry (e.g. `:latest`), set pullPolicy: Always, or you'll hit the exact same staleness problem
  # against a real registry.
  # Preferring a unique, never-reused tag per image (a git SHA, a semver) for published images too sidesteps this more robustly than relying on
  # pullPolicy: Always, and remains compatible with IfNotPresent's more efficient (no registry round trip) local-cache behavior.
  repository: eamerald
  tag: dev
  pullPolicy: IfNotPresent

# eameraldd's directory service uses an embedded, single-writer BoltDB file by default, so this chart is not meant to be scaled beyond one
# replica unless directory.backend is postgres (role: hub) or role is edge, whose local storage is disposable per-pod and safe to run as many
# independent replicas.
replicaCount: 1

# eameraldd's directory storage backend.
directory:
  # boltdb   - embedded, single-writer file. The only sane choice for role: standalone/edge
  #            (an edge's copy is disposable and rebuilt via sync anyway, so there's nothing to gain from a shared DB).
  # postgres - shared, concurrent-safe. Only meaningful for role: hub, to allow replicaCount > 1.
  backend: boltdb
  postgres:
    # Name of a Secret you create yourself (not managed by this chart) with a `dsn` key, e.g.:
    #   kubectl create secret generic eamerald-postgres --from-literal=dsn=postgres://user:pass@host:5432/eamerald
    # Required when directory.backend is postgres. Same convention as entra.existingSecretName below - this chart never handles credential
    # material directly.
    existingSecretName: ""
  manifest:
    # The directory model: object types, relations and permissions.
    # Required for role: standalone/hub. Set it with `make k8s-deploy MANIFEST=<path>`.
    #
    # It is re-applied on every pod start. A changed model can clash with existing data, so k8s-deploy wipes the data volume first.
    content: ""

# Where role: edge syncs from. Required (edge.hub.address) when role: edge;
# unused otherwise.
edge:
  hub:
    # The hub's in-cluster directory address, e.g. eamerald-hub.default.svc.cluster.local:9292
    address: ""
    insecure: true
  syncIntervalMinutes: 1

service:
  # Docker Desktop's Kubernetes maps LoadBalancer services to localhost  automatically, so this "just works" without port-forwarding.
  # Set to ClusterIP on clusters without that (use `kubectl port-forward` instead).
  type: LoadBalancer
  ports:
    health: 9494
    metrics: 9696
    directoryGRPC: 9292
    directoryGateway: 9393
    consoleGRPC: 8081
    consoleGateway: 8080
    authorizerGRPC: 8282
    authorizerGateway: 8383

# Persistent storage for the directory database and generated TLS certs, so
# they survive Pod restarts. Uses the cluster's default StorageClass (Docker
# Desktop provides "hostpath" out of the box) unless storageClassName is set.
persistence:
  enabled: true
  storageClassName: ""
  db:
    size: 1Gi
  certs:
    size: 64Mi

logging:
  level: info

# microsoft entra id (azure ad) directory sync plugin. The client secret is
# never set here: create it yourself as a Kubernetes Secret first, e.g.
#   kubectl create secret generic entra-credentials \
#     --from-literal=client_secret=<your-client-secret>
# then set existingSecretName below to that Secret's name.
entra:
  enabled: false
  tenantId: ""
  clientId: ""
  existingSecretName: ""
  pollIntervalSeconds: 300
  userObjectType: "user"
  groupObjectType: "group"
  memberRelation: "member"

# logius adl level 1 decision logger plugin: emits one record per
# authorization decision, to stdout as a JSON line and/or over OTLP.
adlDecisionLogger:
  enabled: true

  # Where records go: "stdout", "otlp", or both comma-separated. Empty means
  # both. Keep stdout on even when exporting over OTLP: the OTLP exporter
  # batches, so a collector outage loses records, and the pod log is the
  # durable trail the spec asks for.
  output: "stdout,otlp"

  # OTLP log export, e.g. into the Grafana Alloy of the k8s/observability
  # chart, which forwards to Loki. Records carry their producer identity as
  # OTLP resource attributes, so each PDP lands in its own Loki stream.
  #
  # Leave endpoint empty to skip OTLP export entirely; startup then logs
  # that it was skipped rather than failing.
  otlp:
    endpoint: ""   # e.g. "alloy.observability.svc.cluster.local:4317"
    insecure: true # in-cluster collector, no TLS

  # Producer identity, emitted as the `resource` field of every record. The
  # ADL spec requires this to be set whenever records are aggregated outside
  # the producing organisation, so that each record can be attributed
  # unambiguously to the PDP that wrote it. E.g.:
  #   resource:
  #     service.name: eamerald
  #     deployment.environment: production
  resource: {}

# Package root the AuthZEN Access API (POST /access/v1/evaluation) falls back
# to, e.g. "authz" for decisions in `package authz`.
#
# Only used for requests that select no policy themselves; a request naming
# `"doelbinding": "x"` in its context is served by `package doelbinding.x`.
# Leave this empty when the bundle has a single package root - it is then
# unambiguous. Set it when the bundle also carries library packages.
policyRoot: ""

# git policy source plugin: tracks a policy bundle directly from a git repo.
# This is the only policy source this chart configures; there is no OCI/ghcr
# bundle fallback. Only public-repo (unauthenticated HTTPS) fields are
# exposed here; extend with an auth block if a private repo is needed later.
git:
  enabled: true
  repo: "https://github.com/threehook/opa-policies"
  ref: "refs/heads/main"
  path: ""
  pollIntervalSeconds: 60

resources: {}
