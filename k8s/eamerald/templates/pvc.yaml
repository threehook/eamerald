{{- /*
Only for a boltdb-backed standalone/hub install with persistence enabled -
i.e. only when replicaCount is expected to stay 1. A postgres-backed hub or
any role: edge install runs multiple replicas, and a single ReadWriteOnce
PVC can only ever bind to one Pod - the Deployment's volumes fall back to
emptyDir for both in that case (see templates/deployment.yaml).
*/}}
{{- if and .Values.persistence.enabled (ne .Values.directory.backend "postgres") (ne .Values.role "edge") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "eamerald.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.db.size }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-certs
  labels:
    {{- include "eamerald.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.persistence.storageClassName }}
  storageClassName: {{ .Values.persistence.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.certs.size }}
{{- end }}
