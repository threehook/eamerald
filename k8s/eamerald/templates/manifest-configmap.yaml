# The directory manifest (object types, relations, permissions) is always
# whatever model this install explicitly named via values.yaml's
# directory.manifest.content (typically --set-file). Only role: standalone/hub
# own a source-of-truth directory to seed - role: edge receives its manifest
# via the aserto_edge sync plugin instead, so this ConfigMap doesn't apply.
{{- if eq (include "eamerald.hasDirectory" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-manifest
  labels:
    {{- include "eamerald.labels" . | nindent 4 }}
data:
  manifest.yaml: |
    {{- required "directory.manifest.content is required, e.g. --set-file directory.manifest.content=<path>" .Values.directory.manifest.content | nindent 4 }}
{{- end }}
