apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "eamerald.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # BoltDB is a single-writer file. On a shared PVC, RollingUpdate starts the new Pod before the old one releases the lock,
  # so the new Pod crash-loops on open.
  # Not an issue for Postgres (no shared file lock) or role: edge (per-pod local store, not shared across replicas).
  #
  # rollingUpdate must be explicitly nulled out (not just omitted) when type is Recreate: Kubernetes rejects the two
  # together, and a prior release's RollingUpdate defaults linger on the live object across an upgrade otherwise,
  # since server-side apply only clears a field it's explicitly told to.
  strategy:
    {{- if or (eq .Values.directory.backend "postgres") (eq .Values.role "edge") }}
    type: RollingUpdate
    {{- else }}
    type: Recreate
    rollingUpdate: null
    {{- end }}
  selector:
    matchLabels:
      {{- include "eamerald.labels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the Pod when directory.manifest.content changes, so the init container re-applies it. Without this, a manifest change would
        # update the ConfigMap but leave the running directory untouched.
        checksum/manifest: {{ .Values.directory.manifest.content | sha256sum }}
      labels:
        {{- include "eamerald.labels" . | nindent 8 }}
    spec:
      # Applying the manifest offline, before eameraldd starts, rather than against the running service: eamerald-db writes to the database file
      # (or postgres DSN) directly (via an in-process directory server), so this needs no TLS certs, no readiness wait, and no network.
      # It also guarantees the model exists before the first directory write - the entra sync plugin starts writing users and groups about a second
      # after eameraldd becomes ready, and those writes are rejected if their object types are not defined.
      #
      # Only relevant for role: standalone/hub - the ones that own the source-of-truth directory. role: edge has nothing to seed: it only
      # ever receives data via the aserto_edge sync plugin.
      #
      # A boltdb-backed instance's file is single-writer, so this must not run concurrently with eameraldd; an init container is exactly that
      # guarantee. Postgres has no such constraint - mrld-db init/set are plain idempotent client calls, safe to run on every pod start even
      # across multiple hub replicas concurrently.
      {{- if eq (include "eamerald.hasDirectory" .) "true" }}
      initContainers:
        - name: set-manifest
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            {{- if eq .Values.directory.backend "postgres" }}
            - |
              ./mrld-db init "$EAMERALD_DIRECTORY_POSTGRES_DSN"
              ./mrld-db set "$EAMERALD_DIRECTORY_POSTGRES_DSN" /manifest/manifest.yaml
            {{- else }}
            - |
              if [ ! -f /db/directory.db ]; then
                ./mrld-db init /db/directory.db
              fi
              ./mrld-db set /db/directory.db /manifest/manifest.yaml
            {{- end }}
          {{- if eq .Values.directory.backend "postgres" }}
          env:
            {{- include "eamerald.postgresDsnEnv" . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: db
              mountPath: /db
            - name: manifest
              mountPath: /manifest
              readOnly: true
      {{- end }}
      containers:
        - name: eameraldd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./mrldd"]
          args: ["run", "-c", "/config/config.yaml"]
          env:
            - name: EAMERALD_RUNNING_IN_CONTAINER
              value: "true"
            - name: EAMERALD_DB_DIR
              value: /db
            - name: EAMERALD_CERTS_DIR
              value: /certs
            - name: EAMERALD_DECISIONS_DIR
              value: /decisions
          {{- include "eamerald.postgresDsnEnv" . | nindent 12 }}
          {{- if .Values.entra.enabled }}
            - name: ENTRA_TENANT_ID
              value: {{ .Values.entra.tenantId | quote }}
            - name: ENTRA_CLIENT_ID
              value: {{ .Values.entra.clientId | quote }}
            - name: ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "entra.existingSecretName is required when entra.enabled is true" .Values.entra.existingSecretName }}
                  key: client_secret
          {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.service.ports.health }}
            - name: metrics
              containerPort: {{ .Values.service.ports.metrics }}
            - name: dir-grpc
              containerPort: {{ .Values.service.ports.directoryGRPC }}
            - name: dir-gateway
              containerPort: {{ .Values.service.ports.directoryGateway }}
          {{- if eq (include "eamerald.hasDirectory" .) "true" }}
            - name: console-grpc
              containerPort: {{ .Values.service.ports.consoleGRPC }}
            - name: console-gateway
              containerPort: {{ .Values.service.ports.consoleGateway }}
          {{- end }}
          {{- if eq (include "eamerald.hasAuthorizer" .) "true" }}
            - name: authz-grpc
              containerPort: {{ .Values.service.ports.authorizerGRPC }}
            - name: authz-gateway
              containerPort: {{ .Values.service.ports.authorizerGateway }}
          {{- end }}
          # api.health is a plain (non-TLS) gRPC health service in this config, so Kubernetes' built-in gRPC probe talks to it directly.
          #
          # readinessProbe can only pin to one named service, so role: edge (which cares most about having synced data) takes priority over
          # git's readiness gate when both plugins are active there.
          # When git is the policy source (role: standalone only - edge/hub never both gate on it), readiness is pinned to its "git" named health
          # check (NOT_SERVING until the first successful sync, self-heals to SERVING once one lands) so the pod is excluded from the Service
          # until a policy bundle is actually loaded, without ever being restarted for it.
          # Liveness intentionally stays on the default health check regardless, so an unsynced repo/hub never causes a restart loop.
          readinessProbe:
            grpc:
              port: {{ .Values.service.ports.health }}
              {{- if eq .Values.role "edge" }}
              service: "sync"
              {{- else if and .Values.git.enabled (eq (include "eamerald.hasAuthorizer" .) "true") }}
              service: "git"
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: {{ .Values.service.ports.health }}
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: certs
              mountPath: /certs
            - name: db
              mountPath: /db
            - name: decisions
              mountPath: /decisions
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        {{- if eq (include "eamerald.hasDirectory" .) "true" }}
        - name: manifest
          configMap:
            name: {{ .Release.Name }}-manifest
        {{- end }}
        - name: decisions
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: certs
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-certs
        {{- else }}
        - name: certs
          emptyDir: {}
        {{- end }}
        {{- /*
        db is a real PVC only for a boltdb-backed standalone/hub install with persistence enabled. It's always emptyDir for a postgres backend
        (nothing local to persist) and for role: edge (the local cache is disposable by design, rebuilt from the hub on every restart).
        */}}
        {{- if and .Values.persistence.enabled (ne .Values.directory.backend "postgres") (ne .Values.role "edge") }}
        - name: db
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-db
        {{- else }}
        - name: db
          emptyDir: {}
        {{- end }}
