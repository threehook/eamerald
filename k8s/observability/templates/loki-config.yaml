apiVersion: v1
kind: ConfigMap
metadata:
  name: loki
  labels:
    app.kubernetes.io/name: loki
data:
  # Monolithic Loki on filesystem storage: one process, no object store, no
  # ring peers. Sized for a single-node development cluster, not production.
  config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules

    schema_config:
      configs:
        - from: 2024-04-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      # OTLP resource attributes other than service.name are stored as
      # structured metadata, so this is what keeps the ADL producer identity
      # queryable.
      allow_structured_metadata: true
      volume_enabled: true
      retention_period: {{ .Values.loki.retention }}

    compactor:
      working_directory: /loki/compactor
      delete_request_store: filesystem
      retention_enabled: true

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules

    analytics:
      reporting_enabled: false
