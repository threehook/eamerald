apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
        jsonData:
          # ADL records carry the decision's W3C trace ID, so a record can be
          # followed back into whatever tracing backend gets added later.
          derivedFields:
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              url: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
type: Opaque
stringData:
  admin-user: {{ .Values.grafana.adminUser | quote }}
  admin-password: {{ .Values.grafana.adminPassword | quote }}
