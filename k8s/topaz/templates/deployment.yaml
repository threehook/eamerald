apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "topaz.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # topazd's embedded directory database is a single-writer file store (BoltDB):
  # a RollingUpdate would start the new Pod before the old one releases the
  # file lock on the shared PVC, and the new Pod crash-loops on open timeout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "topaz.labels" . | nindent 6 }}
  template:
    metadata:
      {{- if .Values.directory.manifest.enabled }}
      annotations:
        # Roll the Pod when the manifest changes, so the init container
        # re-applies it. Without this, editing files/manifest.yaml would
        # update the ConfigMap but leave the running directory untouched.
        checksum/manifest: {{ .Files.Get "files/manifest.yaml" | sha256sum }}
      {{- end }}
      labels:
        {{- include "topaz.labels" . | nindent 8 }}
    spec:
      {{- if .Values.directory.manifest.enabled }}
      # Applying the manifest offline, before topazd starts, rather than
      # against the running service: topaz-db writes to the database file
      # directly (via an in-process directory server), so this needs no TLS
      # certs, no readiness wait, and no network. It also guarantees the model
      # exists before the first directory write - the entra sync plugin starts
      # writing users and groups about a second after topazd becomes ready,
      # and those writes are rejected if their object types are not defined.
      #
      # topazd's BoltDB is single-writer, so this must not run concurrently
      # with topazd; an init container is exactly that guarantee.
      initContainers:
        - name: set-manifest
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              if [ ! -f /db/directory.db ]; then
                ./topaz-db init /db/directory.db
              fi
              ./topaz-db set /db/directory.db /manifest/manifest.yaml
          volumeMounts:
            - name: db
              mountPath: /db
            - name: manifest
              mountPath: /manifest
              readOnly: true
      {{- end }}
      containers:
        - name: topazd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["./topazd"]
          args: ["run", "-c", "/config/config.yaml"]
          env:
            - name: TOPAZ_RUNNING_IN_CONTAINER
              value: "true"
            - name: TOPAZ_DB_DIR
              value: /db
            - name: TOPAZ_CERTS_DIR
              value: /certs
            - name: TOPAZ_DECISIONS_DIR
              value: /decisions
          {{- if .Values.entra.enabled }}
            - name: ENTRA_TENANT_ID
              value: {{ .Values.entra.tenantId | quote }}
            - name: ENTRA_CLIENT_ID
              value: {{ .Values.entra.clientId | quote }}
            - name: ENTRA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "entra.existingSecretName is required when entra.enabled is true" .Values.entra.existingSecretName }}
                  key: client_secret
          {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.service.ports.health }}
            - name: metrics
              containerPort: {{ .Values.service.ports.metrics }}
            - name: dir-grpc
              containerPort: {{ .Values.service.ports.directoryGRPC }}
            - name: dir-gateway
              containerPort: {{ .Values.service.ports.directoryGateway }}
            - name: console-grpc
              containerPort: {{ .Values.service.ports.consoleGRPC }}
            - name: console-gateway
              containerPort: {{ .Values.service.ports.consoleGateway }}
            - name: authz-grpc
              containerPort: {{ .Values.service.ports.authorizerGRPC }}
            - name: authz-gateway
              containerPort: {{ .Values.service.ports.authorizerGateway }}
          # api.health is a plain (non-TLS) gRPC health service in this config,
          # so Kubernetes' built-in gRPC probe talks to it directly.
          # When git is the policy source, readiness is pinned to its "git"
          # named health check (NOT_SERVING until the first successful sync,
          # self-heals to SERVING once one lands) so the pod is excluded from
          # the Service until a policy bundle is actually loaded, without
          # ever being restarted for it. Liveness intentionally stays on the
          # default health check regardless, so an unsynced repo never
          # causes a restart loop.
          readinessProbe:
            grpc:
              port: {{ .Values.service.ports.health }}
              {{- if .Values.git.enabled }}
              service: "git"
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: {{ .Values.service.ports.health }}
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: certs
              mountPath: /certs
            - name: db
              mountPath: /db
            - name: decisions
              mountPath: /decisions
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        {{- if .Values.directory.manifest.enabled }}
        - name: manifest
          configMap:
            name: {{ .Release.Name }}-manifest
        {{- end }}
        - name: decisions
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: certs
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-certs
        - name: db
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-db
        {{- else }}
        - name: certs
          emptyDir: {}
        - name: db
          emptyDir: {}
        {{- end }}
